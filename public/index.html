<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PG Food Board - Frosted Glass Menu Workspace</title>
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>
  <!-- Ambient background blobs -->
  <div class="ambient-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Header Section -->
  <header class="app-header glass-panel">
    <a href="/" class="logo" id="logo-link">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      <span>PG Food Board</span>
    </a>

    <!-- Header Controls -->
    <div class="header-controls">
      <!-- Theme Switcher -->
      <button class="btn btn-icon" id="theme-toggle" aria-label="Toggle Theme">
        <svg id="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- View Toggle (Desktop Only) -->
      <div class="view-switch" id="view-selector">
        <button class="view-switch-btn active" data-view="board">Board</button>
        <button class="view-switch-btn" data-view="grid">Grid</button>
      </div>

      <!-- Favorites Filter Toggle -->
      <button class="btn" id="fav-filter-btn">
        <span class="star-icon">☆</span> <span class="btn-text">Favorites</span>
      </button>

      <!-- Submit New PG Button -->
      <button class="btn btn-primary" id="open-submit-pg-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="btn-text">Submit PG</span>
      </button>

      <!-- Admin Dashboard Toggle (Hidden by default) -->
      <button class="btn" id="admin-panel-btn" style="display: none; border-color: var(--accent-orange); color: var(--accent-orange);">
        🛡 <span class="btn-text">Admin Panel</span>
      </button>

      <!-- Authentication Section -->
      <div id="auth-section">
        <button class="btn" id="login-btn">👤 <span class="btn-text">Login</span></button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-container">
    <!-- Admin Dashboard (Visible to Admins only) -->
    <section class="admin-section glass-panel" id="admin-dashboard-container">
      <div class="admin-header">
        <h2 class="admin-title">Admin Moderation Dashboard</h2>
        <button class="btn" id="close-admin-btn">Back to Board</button>
      </div>
      <div class="submissions-list" id="submissions-list-container">
        <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
          No pending submissions.
        </div>
      </div>
    </section>

    <!-- PGs List Container -->
    <section id="pg-workspace-section">
      <!-- Workspace Board (Draggable container) -->
      <div class="workspace-board" id="board-workspace"></div>

      <!-- Workspace Grid (Standard grid container, hidden initially) -->
      <div class="workspace-grid" id="grid-workspace" style="display: none;"></div>
    </section>
  </main>

  <!-- ==================== MODALS & DIALOGS ==================== -->

  <!-- AUTH MODAL (Login/Registration) -->
  <dialog id="auth-dialog">
    <div class="dialog-header">
      <h3 class="dialog-title" id="auth-dialog-title">Login</h3>
      <button type="button" class="btn btn-icon" onclick="document.getElementById('auth-dialog').close()" style="font-size: 24px;">×</button>
    </div>
    <form id="auth-form" method="dialog">
      <div class="form-group">
        <label for="auth-username">Username</label>
        <input type="text" class="form-control" id="auth-username" required autocomplete="username" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label for="auth-password">Password</label>
        <input type="password" class="form-control" id="auth-password" required autocomplete="current-password" placeholder="Enter password">
      </div>
      <div id="auth-error-msg" style="color: var(--accent-red); font-size: 13px; margin-bottom: 15px; display: none;"></div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
        <span style="font-size: 13px; color: var(--text-secondary); cursor: pointer;" id="auth-toggle-mode">
          Need an account? Register
        </span>
        <button type="submit" class="btn btn-primary" id="auth-submit-btn">Login</button>
      </div>
    </form>
  </dialog>

  <!-- SUBMIT NEW PG MODAL (Multi-step Form) -->
  <dialog id="submit-pg-dialog">
    <div class="dialog-header">
      <h3 class="dialog-title" id="submit-pg-title">Submit New PG</h3>
      <button type="button" class="btn btn-icon" onclick="document.getElementById('submit-pg-dialog').close()" style="font-size: 24px;">×</button>
    </div>
    
    <div class="step-indicator">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot" id="dot-2"></div>
      <div class="step-dot" id="dot-3" style="display: none;"></div>
    </div>

    <form id="submit-pg-form" method="dialog">
      <!-- STEP 1: Basic Info -->
      <div class="step-container active" id="step-1-container">
        <div class="form-group">
          <label for="new-pg-name">PG Name</label>
          <input type="text" class="form-control" id="new-pg-name" required placeholder="e.g. Starlight PG">
        </div>
        <div class="form-group">
          <label>Menu Routine Schedule</label>
          <div class="segmented-control">
            <div class="segmented-option">
              <input type="radio" id="cycle-1" name="pg-cycle" value="1" checked>
              <label for="cycle-1">1-Week Schedule</label>
            </div>
            <div class="segmented-option">
              <input type="radio" id="cycle-2" name="pg-cycle" value="2">
              <label for="cycle-2">2-Week Alternating</label>
            </div>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
          <button type="button" class="btn btn-primary" id="next-step-1-btn">Next: Setup Menu</button>
        </div>
      </div>

      <!-- STEP 2: Week 1 Food Items -->
      <div class="step-container" id="step-2-container">
        <h4 style="margin-bottom: 15px; font-weight: 600;">Week 1 Food Menu</h4>
        <div class="scrollable-form-body" id="week-1-inputs">
          <!-- Days input will be populated dynamically -->
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 24px;">
          <button type="button" class="btn" id="prev-step-2-btn">Back</button>
          <button type="button" class="btn btn-primary" id="next-step-2-btn">Next Step</button>
        </div>
      </div>

      <!-- STEP 3: Week 2 Food Items (Only shown if cycle=2) -->
      <div class="step-container" id="step-3-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h4 style="margin: 0; font-weight: 600;">Week 2 Food Menu</h4>
          <button type="button" class="btn" onclick="copyWeek1ToWeek2()" style="font-size: 11px; padding: 4px 10px; border-radius: 8px;">
            📋 Copy Week 1
          </button>
        </div>
        <div class="scrollable-form-body" id="week-2-inputs">
          <!-- Days input will be populated dynamically if cycle 2 -->
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 24px;">
          <button type="button" class="btn" id="prev-step-3-btn">Back</button>
          <button type="submit" class="btn btn-success" id="submit-pg-db-btn">Submit Menu</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- VIEW WEEKLY MENU DIALOG (Tabs for Week 1/2) -->
  <dialog id="menu-detail-dialog">
    <div class="dialog-header">
      <h3 class="dialog-title" id="menu-detail-title">Weekly Food Schedule</h3>
      <button type="button" class="btn btn-icon" onclick="document.getElementById('menu-detail-dialog').close()" style="font-size: 24px;">×</button>
    </div>
    
    <div class="menu-viewer-container">
      <div class="week-tabs" id="viewer-week-tabs" style="display: none;">
        <button class="week-tab-btn active" id="tab-week-1-btn" onclick="switchViewerWeek(1)">Week 1</button>
        <button class="week-tab-btn" id="tab-week-2-btn" onclick="switchViewerWeek(2)">Week 2</button>
      </div>
      
      <div class="menu-rows-container" id="menu-grid-display">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </dialog>

  <!-- Javascript Core Interactivity -->
  <script>
    // State Variables
    let currentUser = null;
    let token = localStorage.getItem('token');
    let pgsList = [];
    let favoritesList = [];
    let currentView = localStorage.getItem('view') || 'board';
    let filterFavoritesOnly = false;
    let authMode = 'login'; // 'login' or 'register'
    let tempSubmissionMenus = {};
    
    // Day/Meal translation helper based on IST rules
    const DAYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
    const MEALS = ['breakfast', 'lunch', 'dinner'];

    // DOM Elements
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const viewSelector = document.getElementById('view-selector');
    const viewButtons = viewSelector.querySelectorAll('.view-switch-btn');
    const favFilterBtn = document.getElementById('fav-filter-btn');
    const loginBtn = document.getElementById('login-btn');
    const authSection = document.getElementById('auth-section');
    const authDialog = document.getElementById('auth-dialog');
    const authForm = document.getElementById('auth-form');
    const authTitle = document.getElementById('auth-dialog-title');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const authToggleMode = document.getElementById('auth-toggle-mode');
    const authErrorMsg = document.getElementById('auth-error-msg');
    
    const boardWorkspace = document.getElementById('board-workspace');
    const gridWorkspace = document.getElementById('grid-workspace');
    
    const adminPanelBtn = document.getElementById('admin-panel-btn');
    const adminDashboard = document.getElementById('admin-dashboard-container');
    const pgWorkspaceSection = document.getElementById('pg-workspace-section');
    const submissionsContainer = document.getElementById('submissions-list-container');
    const closeAdminBtn = document.getElementById('close-admin-btn');
    
    const submitPgBtn = document.getElementById('open-submit-pg-btn');
    const submitPgDialog = document.getElementById('submit-pg-dialog');
    const submitPgForm = document.getElementById('submit-pg-form');
    
    const menuDetailDialog = document.getElementById('menu-detail-dialog');
    
    // Drag-and-drop state
    let activeDraggedCard = null;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartCardLeft = 0;
    let dragStartCardTop = 0;

    // Initialize application
    async function init() {
      setupTheme();
      setupEventListeners();
      
      // Auto-fetch profile if logged in
      if (token) {
        await fetchUserProfile();
      } else {
        updateAuthUI();
      }
      
      await fetchPGs();
      
      // Force grid view on mobile
      if (window.innerWidth <= 768) {
        setView('grid');
      } else {
        setView(currentView);
      }
      
      renderPGs();
      buildFormMenuInputs();
    }

    // Set View (Board or Grid)
    function setView(viewType) {
      currentView = viewType;
      localStorage.setItem('view', viewType);
      
      viewButtons.forEach(btn => {
        if (btn.dataset.view === viewType) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      
      if (viewType === 'board' && window.innerWidth > 768) {
        boardWorkspace.style.display = 'block';
        gridWorkspace.style.display = 'none';
      } else {
        boardWorkspace.style.display = 'none';
        gridWorkspace.style.display = 'grid';
      }
      
      renderPGs();
    }

    // Theme Management (Light vs Dark)
    function setupTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      if (savedTheme === 'light') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      
      if (newTheme === 'light') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    // Fetch Logged-in User Info
    async function fetchUserProfile() {
      try {
        const response = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const data = await response.json();
          currentUser = data.user;
          favoritesList = currentUser.favorites || [];
          updateAuthUI();
        } else {
          // Token expired or invalid
          logout();
        }
      } catch (err) {
        console.error('Error fetching user profile:', err);
      }
    }

    // Update login state elements in UI
    function updateAuthUI() {
      if (currentUser) {
        authSection.innerHTML = `
          <div class="user-badge">
            <span style="font-weight:600;" class="btn-text">${currentUser.username}</span>
            ${currentUser.role === 'admin' ? '<span class="user-badge-role btn-text">Admin</span>' : ''}
            <button class="btn" style="padding: 6px 10px; border-radius: 10px; font-size:12px; margin-left: 6px;" id="logout-btn" title="Logout">
              ↩ <span class="btn-text">Logout</span>
            </button>
          </div>
        `;
        document.getElementById('logout-btn').addEventListener('click', logout);
        
        // Show Admin button if admin
        if (currentUser.role === 'admin') {
          adminPanelBtn.style.display = 'inline-flex';
        } else {
          adminPanelBtn.style.display = 'none';
        }
      } else {
        authSection.innerHTML = `<button class="btn" id="login-btn">👤 <span class="btn-text">Login</span></button>`;
        document.getElementById('login-btn').addEventListener('click', () => openAuthModal('login'));
        adminPanelBtn.style.display = 'none';
        adminDashboard.style.display = 'none';
        pgWorkspaceSection.style.display = 'block';
      }
      
      // Update favorites filter button text/state
      updateFavoritesFilterBtn();
      renderPGs();
    }

    // Log out user
    function logout() {
      token = null;
      currentUser = null;
      favoritesList = [];
      localStorage.removeItem('token');
      updateAuthUI();
      renderPGs();
    }

    // Fetch PGs list from DB
    async function fetchPGs() {
      try {
        const response = await fetch('/api/pgs');
        if (response.ok) {
          pgsList = await response.json();
        }
      } catch (err) {
        console.error('Error fetching PGs:', err);
      }
    }

    // Determine current day and meal period according to IST timezone rules
    function getCurrentISTDayAndMeal() {
      const now = new Date();
      
      // Calculate IST time details using Intl.DateTimeFormat
      const hourFormatter = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kolkata', hour: 'numeric', hour12: false });
      const dayFormatter = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kolkata', weekday: 'long' });
      
      const hourIST = parseInt(hourFormatter.format(now));
      const dayIST = dayFormatter.format(now).toLowerCase();
      
      let displayDay = dayIST;
      let displayMeal = 'dinner';
      
      if (hourIST >= 22 || hourIST < 8) {
        displayMeal = 'breakfast';
        if (hourIST >= 22) {
          // It's past 10 PM. Show next day's breakfast
          const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
          displayDay = dayFormatter.format(tomorrow).toLowerCase();
        }
      } else if (hourIST >= 8 && hourIST < 13) {
        displayMeal = 'lunch';
      } else {
        displayMeal = 'dinner';
      }
      
      return { day: displayDay, meal: displayMeal };
    }

    // Build lists of inputs for new PG form setup
    function buildFormMenuInputs() {
      const week1Container = document.getElementById('week-1-inputs');
      const week2Container = document.getElementById('week-2-inputs');
      
      let html1 = '';
      let html2 = '';
      
      DAYS.forEach(day => {
        // Week 1
        html1 += `
          <div class="form-day-row">
            <div class="form-day-header">${day}</div>
            <div class="form-meals-grid">
              <div class="form-group" style="margin-bottom:0;">
                <label>Breakfast</label>
                <input type="text" class="form-control" name="w1-${day}-breakfast" placeholder="e.g. Idli, Coffee">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label>Lunch</label>
                <input type="text" class="form-control" name="w1-${day}-lunch" placeholder="e.g. Rice, Dal">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label>Dinner</label>
                <input type="text" class="form-control" name="w1-${day}-dinner" placeholder="e.g. Roti, Matar Curry">
              </div>
            </div>
          </div>
        `;
        
        // Week 2
        html2 += `
          <div class="form-day-row">
            <div class="form-day-header">${day} (Week 2)</div>
            <div class="form-meals-grid">
              <div class="form-group" style="margin-bottom:0;">
                <label>Breakfast</label>
                <input type="text" class="form-control" name="w2-${day}-breakfast" placeholder="e.g. Poha, Tea">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label>Lunch</label>
                <input type="text" class="form-control" name="w2-${day}-lunch" placeholder="e.g. Fried Rice">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label>Dinner</label>
                <input type="text" class="form-control" name="w2-${day}-dinner" placeholder="e.g. Chicken, Rice">
              </div>
            </div>
          </div>
        `;
      });
      
      week1Container.innerHTML = html1;
      week2Container.innerHTML = html2;
    }

    // Copy Week 1 menu inputs to Week 2 inputs
    function copyWeek1ToWeek2() {
      if (!confirm('Are you sure you want to overwrite Week 2 inputs with Week 1 menu?')) {
        return;
      }
      DAYS.forEach(day => {
        ['breakfast', 'lunch', 'dinner'].forEach(meal => {
          const w1Val = submitPgForm.querySelector(`[name="w1-${day}-${meal}"]`).value;
          const w2Input = submitPgForm.querySelector(`[name="w2-${day}-${meal}"]`);
          if (w2Input) {
            w2Input.value = w1Val;
          }
        });
      });
    }

    // Render PGs into board or grid view
    function renderPGs() {
      const { day: istDay, meal: istMeal } = getCurrentISTDayAndMeal();
      
      let filteredPGs = pgsList;
      if (filterFavoritesOnly) {
        filteredPGs = pgsList.filter(pg => favoritesList.includes(pg._id));
      }
      
      // Clear containers
      boardWorkspace.innerHTML = '';
      gridWorkspace.innerHTML = '';
      
      if (filteredPGs.length === 0) {
        const noDataHtml = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-secondary);">No PGs to display. ${filterFavoritesOnly ? 'Try favoriting some PGs first!' : ''}</div>`;
        boardWorkspace.innerHTML = noDataHtml;
        gridWorkspace.innerHTML = noDataHtml;
        return;
      }
      
      const placedPositions = [];
      
      filteredPGs.forEach(pg => {
        const isFav = favoritesList.includes(pg._id);
        const cardId = `card-${pg._id}`;
        
        // Define admin-only delete button
        let adminDeleteBtnHtml = '';
        if (currentUser && currentUser.role === 'admin') {
          adminDeleteBtnHtml = `
            <button class="btn-delete-pg" onclick="deletePGByAdmin('${pg._id}', '${pg.name}')" title="Delete PG (Admin Only)" aria-label="Delete PG">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          `;
        }
        
        // Determine today's menu list for card preview
        let menuItems = ['No menu configured'];
        
        // Find if this PG supports week 2 and what week we are on. (Just default to week 1 for preview highlights)
        if (pg.menu && pg.menu.week1 && pg.menu.week1[istDay] && pg.menu.week1[istDay][istMeal]) {
          const items = pg.menu.week1[istDay][istMeal];
          if (items.length > 0) menuItems = items;
        }

        const itemsListHtml = menuItems.map(item => `<div>• ${item}</div>`).join('');
        
        const cardHtml = `
          <div class="pg-card glass-panel" id="${cardId}" data-id="${pg._id}">
            <div class="pg-card-header">
              <h4 class="pg-title">${pg.name}</h4>
              <div class="card-actions">
                ${adminDeleteBtnHtml}
                <button class="btn-edit" onclick="openEditMenuModal('${pg._id}')" title="Request Menu Edit" aria-label="Edit PG">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button class="btn-star ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${pg._id}')" aria-label="Favorite PG">
                  ${isFav ? '★' : '☆'}
                </button>
              </div>
            </div>
            <div class="pg-card-body">
              <div class="today-highlight">
                <div class="highlight-title">
                  <span>Today's Meal</span>
                  <span class="meal-label">${istMeal}</span>
                </div>
                <div class="meal-items">${itemsListHtml}</div>
              </div>
            </div>
            <div class="pg-card-footer">
              <span class="menu-cycle-badge">${pg.weeklyCycle} Week Routine</span>
              <button class="btn" style="padding: 6px 12px; border-radius:10px; font-size:12px;" onclick="openWeeklyMenuModal('${pg._id}')">View Menu</button>
            </div>
          </div>
        `;
        
        // Add to Grid view
        const gridCardWrapper = document.createElement('div');
        gridCardWrapper.innerHTML = cardHtml;
        const gridCardElem = gridCardWrapper.firstElementChild;
        
        // Open weekly menu on clicking card (excluding buttons/stars/edits/deletes)
        gridCardElem.addEventListener('click', (e) => {
          if (e.target.closest('button') || e.target.closest('svg') || e.target.classList.contains('btn-star') || e.target.classList.contains('btn-edit') || e.target.classList.contains('btn-delete-pg')) {
            return;
          }
          openWeeklyMenuModal(pg._id);
        });
        
        gridWorkspace.appendChild(gridCardElem);
        
        // Add to Board view
        const boardCard = document.createElement('div');
        boardCard.innerHTML = cardHtml;
        const cardElem = boardCard.firstElementChild;
        
        // Set coordinates with anti-overlap system
        const savedPos = localStorage.getItem(`pg_pos_${pg._id}`);
        let x, y;
        if (savedPos) {
          const pos = JSON.parse(savedPos);
          x = pos.x;
          y = pos.y;
        } else {
          // Cascade layout positions if not defined
          const index = filteredPGs.findIndex(p => p._id === pg._id);
          x = 30 + (index % 3) * 340;
          y = 30 + Math.floor(index / 3) * 250;
        }

        // Anti-overlap solver (Board View only)
        const cardWidth = 320;
        const cardHeight = 220;
        let attempts = 0;
        let overlapping = true;
        
        while (overlapping && attempts < 100) {
          overlapping = false;
          for (let pos of placedPositions) {
            // Check bounding box intersection (add 20px padding)
            if (x < pos.x + pos.w && x + cardWidth > pos.x &&
                y < pos.y + pos.h && y + cardHeight > pos.y) {
              overlapping = true;
              // Shift right
              x += 40;
              // Wrap lines if it overflows workspace width
              const boardWidth = boardWorkspace.clientWidth || 1000;
              if (x + cardWidth > boardWidth) {
                x = 30;
                y += 40;
              }
              break;
            }
          }
          attempts++;
        }
        
        placedPositions.push({ x, y, w: cardWidth + 20, h: cardHeight + 20 });
        
        cardElem.style.left = `${x}px`;
        cardElem.style.top = `${y}px`;
        
        // Enable drag handlers for board layout
        setupCardDrag(cardElem, pg._id);
        
        boardWorkspace.appendChild(cardElem);
      });
    }

    // Drag-and-drop handler for board layout
    function setupCardDrag(card, pgId) {
      // Click handler for opening weekly menu dialog
      card.addEventListener('click', (e) => {
        // Prevent click if we dragged the card
        if (card.dataset.dragged === 'true') {
          card.removeAttribute('data-dragged');
          return;
        }
        // Prevent modal if clicking button or star
        if (e.target.closest('button') || e.target.closest('svg') || e.target.classList.contains('btn-star')) {
          return;
        }
        openWeeklyMenuModal(pgId);
      });

      // Mouse down handler
      card.addEventListener('mousedown', (e) => {
        // Prevent drag triggers on clicking buttons inside card
        if (e.target.closest('button') || e.target.closest('a') || e.target.closest('input')) {
          return;
        }
        
        activeDraggedCard = card;
        card.classList.add('dragging');
        
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        
        dragStartCardLeft = parseInt(card.style.left) || 0;
        dragStartCardTop = parseInt(card.style.top) || 0;
        
        // Increase drag z-index
        card.style.zIndex = 1000;
        
        document.addEventListener('mousemove', onCardDrag);
        document.addEventListener('mouseup', onCardDragEnd);
      });
      
      // Touch support
      card.addEventListener('touchstart', (e) => {
        if (e.target.closest('button') || e.target.closest('a') || e.target.closest('input')) {
          return;
        }
        
        activeDraggedCard = card;
        card.classList.add('dragging');
        
        const touch = e.touches[0];
        dragStartX = touch.clientX;
        dragStartY = touch.clientY;
        
        dragStartCardLeft = parseInt(card.style.left) || 0;
        dragStartCardTop = parseInt(card.style.top) || 0;
        
        card.style.zIndex = 1000;
        
        document.addEventListener('touchmove', onCardTouchDrag, { passive: false });
        document.addEventListener('touchend', onCardTouchDragEnd);
      });
    }

    function onCardDrag(e) {
      if (!activeDraggedCard) return;
      
      const deltaX = e.clientX - dragStartX;
      const deltaY = e.clientY - dragStartY;
      
      if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
        activeDraggedCard.dataset.dragged = 'true';
      }
      
      let newLeft = dragStartCardLeft + deltaX;
      let newTop = dragStartCardTop + deltaY;
      
      // Keep boundaries inside workspace board
      const boardWidth = boardWorkspace.clientWidth;
      const boardHeight = boardWorkspace.clientHeight;
      const cardWidth = activeDraggedCard.clientWidth;
      const cardHeight = activeDraggedCard.clientHeight;
      
      newLeft = Math.max(0, Math.min(newLeft, boardWidth - cardWidth));
      newTop = Math.max(0, Math.min(newTop, boardHeight - cardHeight));
      
      activeDraggedCard.style.left = `${newLeft}px`;
      activeDraggedCard.style.top = `${newTop}px`;
    }

    function onCardDragEnd() {
      if (!activeDraggedCard) return;
      
      activeDraggedCard.classList.remove('dragging');
      activeDraggedCard.style.zIndex = 10;
      
      // Save coordinate positions in localStorage
      const pgId = activeDraggedCard.dataset.id;
      localStorage.setItem(`pg_pos_${pgId}`, JSON.stringify({
        x: parseInt(activeDraggedCard.style.left),
        y: parseInt(activeDraggedCard.style.top)
      }));
      
      activeDraggedCard = null;
      document.removeEventListener('mousemove', onCardDrag);
      document.removeEventListener('mouseup', onCardDragEnd);
    }

    // Touch handlers mirroring mouse behaviors
    function onCardTouchDrag(e) {
      if (!activeDraggedCard) return;
      e.preventDefault(); // Prevent scrolling screen while dragging cards
      
      const touch = e.touches[0];
      const deltaX = touch.clientX - dragStartX;
      const deltaY = touch.clientY - dragStartY;
      
      if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
        activeDraggedCard.dataset.dragged = 'true';
      }
      
      let newLeft = dragStartCardLeft + deltaX;
      let newTop = dragStartCardTop + deltaY;
      
      const boardWidth = boardWorkspace.clientWidth;
      const boardHeight = boardWorkspace.clientHeight;
      const cardWidth = activeDraggedCard.clientWidth;
      const cardHeight = activeDraggedCard.clientHeight;
      
      newLeft = Math.max(0, Math.min(newLeft, boardWidth - cardWidth));
      newTop = Math.max(0, Math.min(newTop, boardHeight - cardHeight));
      
      activeDraggedCard.style.left = `${newLeft}px`;
      activeDraggedCard.style.top = `${newTop}px`;
    }

    function onCardTouchDragEnd() {
      if (!activeDraggedCard) return;
      
      activeDraggedCard.classList.remove('dragging');
      activeDraggedCard.style.zIndex = 10;
      
      const pgId = activeDraggedCard.dataset.id;
      localStorage.setItem(`pg_pos_${pgId}`, JSON.stringify({
        x: parseInt(activeDraggedCard.style.left),
        y: parseInt(activeDraggedCard.style.top)
      }));
      
      activeDraggedCard = null;
      document.removeEventListener('touchmove', onCardTouchDrag);
      document.removeEventListener('touchend', onCardTouchDragEnd);
    }

    // Submit PG form payload building
    async function submitNewPGForm() {
      const name = document.getElementById('new-pg-name').value;
      const cycleOption = document.querySelector('input[name="pg-cycle"]:checked').value;
      const cycle = parseInt(cycleOption);
      
      // Build menu structure
      const menu = {
        week1: {},
        week2: {}
      };
      
      DAYS.forEach(day => {
        menu.week1[day] = {
          breakfast: parseFoodInput(submitPgForm.querySelector(`[name="w1-${day}-breakfast"]`).value),
          lunch: parseFoodInput(submitPgForm.querySelector(`[name="w1-${day}-lunch"]`).value),
          dinner: parseFoodInput(submitPgForm.querySelector(`[name="w1-${day}-dinner"]`).value)
        };
        
        if (cycle === 2) {
          menu.week2[day] = {
            breakfast: parseFoodInput(submitPgForm.querySelector(`[name="w2-${day}-breakfast"]`).value),
            lunch: parseFoodInput(submitPgForm.querySelector(`[name="w2-${day}-lunch"]`).value),
            dinner: parseFoodInput(submitPgForm.querySelector(`[name="w2-${day}-dinner"]`).value)
          };
        } else {
          menu.week2[day] = { breakfast: [], lunch: [], dinner: [] };
        }
      });
      
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }
        
        const response = await fetch('/api/pgs/submit', {
          method: 'POST',
          headers,
          body: JSON.stringify({ name, weeklyCycle: cycle, menu })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          alert('Submission successful! It has been sent to the admin moderation queue.');
          submitPgDialog.close();
        } else {
          alert('Failed to submit: ' + data.error);
        }
      } catch (err) {
        console.error('Error submitting PG:', err);
        alert('Network error. Failed to submit.');
      }
    }

      const name = document.getElementById('new-pg-name').value;
      const cycleOption = document.querySelector('input[name="pg-cycle"]:checked').value;
      const cycle = parseInt(cycleOption);
      
      // Build menu structure
      const menu = {
        week1: {},
        week2: {}
      };
      
      DAYS.forEach(day => {
        menu.week1[day] = {
          breakfast: parseFoodInput(submitPgForm.querySelector(`[name="w1-${day}-breakfast"]`).value),
          lunch: parseFoodInput(submitPgForm.querySelector(`[name="w1-${day}-lunch"]`).value),
          dinner: parseFoodInput(submitPgForm.querySelector(`[name="w1-${day}-dinner"]`).value)
        };
        
        if (cycle === 2) {
          menu.week2[day] = {
            breakfast: parseFoodInput(submitPgForm.querySelector(`[name="w2-${day}-breakfast"]`).value),
            lunch: parseFoodInput(submitPgForm.querySelector(`[name="w2-${day}-lunch"]`).value),
            dinner: parseFoodInput(submitPgForm.querySelector(`[name="w2-${day}-dinner"]`).value)
          };
        } else {
          menu.week2[day] = { breakfast: [], lunch: [], dinner: [] };
        }
      });
      
      try {
        const response = await fetch('/api/pgs/edit-request', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ pgId: activeEditPGId, name, weeklyCycle: cycle, menu })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          alert('Edit request submitted successfully! It has been sent to the admin moderation queue.');
          submitPgDialog.close();
          // Reset form handlers to default additions behavior
          resetNewPGFormHandlers();
        } else {
          alert('Failed to submit edit: ' + data.error);
        }
      } catch (err) {
        console.error('Error submitting edit PG:', err);
        alert('Network error. Failed to submit edit request.');
      }
    }

    // Reset PG submit modal form listeners back to adding new PG
    function resetNewPGFormHandlers() {
      document.getElementById('submit-pg-title').textContent = 'Submit New PG';
      
      submitPgForm.onsubmit = (e) => {
        e.preventDefault();
        submitNewPGForm();
      };
      
      const nextStep2Btn = document.getElementById('next-step-2-btn');
      const newNextStep2 = nextStep2Btn.cloneNode(true);
      nextStep2Btn.parentNode.replaceChild(newNextStep2, nextStep2Btn);
      
      newNextStep2.addEventListener('click', () => {
        const cycle = document.getElementById('cycle-2').checked ? 2 : 1;
        if (cycle === 2) {
          document.getElementById('step-2-container').classList.remove('active');
          document.getElementById('step-3-container').classList.add('active');
          document.getElementById('dot-2').classList.remove('active');
          document.getElementById('dot-3').classList.add('active');
        } else {
          submitNewPGForm();
        }
      });
    }

    // Admin Dashboard Moderation Screen Actions
    async function openAdminPanel() {
      pgWorkspaceSection.style.display = 'none';
      adminDashboard.style.display = 'block';
      await fetchAndRenderSubmissions();
    }

    function closeAdminPanel() {
      adminDashboard.style.display = 'none';
      pgWorkspaceSection.style.display = 'block';
      renderPGs();
    }

    async function fetchAndRenderSubmissions() {
      try {
        const response = await fetch('/api/submissions', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
          const submissions = await response.json();
          renderSubmissionsList(submissions);
        } else {
          submissionsContainer.innerHTML = `<div style="text-align: center; color: var(--accent-red);">Unauthorized. Admin rights required.</div>`;
        }
      } catch (err) {
        console.error('Error fetching submissions:', err);
        submissionsContainer.innerHTML = `<div style="text-align: center; color: var(--accent-red);">Failed to load submissions.</div>`;
      }
    }

    // Compare lists item helper for side-by-side diff displays
    function formatMealListDiff(currentMeals, proposedMeals, isProposedColumn, isEditType = true) {
      if (!currentMeals) currentMeals = [];
      if (!proposedMeals) proposedMeals = [];
      
      if (!isEditType) {
        const list = isProposedColumn ? proposedMeals : currentMeals;
        if (!list || list.length === 0) return '<em style="color:var(--text-tertiary);">None</em>';
        return list.join(', ');
      }
      
      if (isProposedColumn) {
        if (proposedMeals.length === 0) return '<em style="color:var(--text-tertiary);">None</em>';
        return proposedMeals.map(item => {
          const cleanItem = item.trim();
          const isAdded = !currentMeals.some(c => c.trim().toLowerCase() === cleanItem.toLowerCase());
          if (isAdded) {
            return `<span style="color: var(--accent-green); font-weight: 600;">+ ${item}</span>`;
          }
          return item;
        }).join(', ');
      } else {
        if (currentMeals.length === 0) return '<em style="color:var(--text-tertiary);">None</em>';
        return currentMeals.map(item => {
          const cleanItem = item.trim();
          const isRemoved = !proposedMeals.some(p => p.trim().toLowerCase() === cleanItem.toLowerCase());
          if (isRemoved) {
            return `<span style="color: var(--accent-red); text-decoration: line-through;">${item}</span>`;
          }
          return item;
        }).join(', ');
      }
    }

    function renderSubmissionsList(submissions) {
      submissionsContainer.innerHTML = '';
      tempSubmissionMenus = {}; // Clear
      
      const pendingSubmissions = submissions.filter(s => s.status === 'pending');
      
      if (pendingSubmissions.length === 0) {
        submissionsContainer.innerHTML = `
          <div style="text-align: center; padding: 60px; color: var(--text-secondary);">
            🎉 All caught up! No pending PG additions or edit requests.
          </div>
        `;
        return;
      }
      
      pendingSubmissions.forEach(sub => {
        const subId = sub._id;
        const subDate = new Date(sub.createdAt).toLocaleString();
        tempSubmissionMenus[subId] = sub.data.menu; // Store for weekly viewer
        
        let subContentHtml = '';
        
        if (sub.type === 'new') {
          // Displaying proposed PG items
          subContentHtml = `
            <div style="margin-top: 10px;">
              <strong>Proposed Cycle:</strong> ${sub.data.weeklyCycle} Week Routine <br>
              <div style="margin-top:10px; padding: 15px; border-radius:12px; background: rgba(255,255,255,0.03); border:1px solid var(--glass-border);">
                <strong>Proposed Week 1 Menu Highlight (Monday):</strong> <br>
                Breakfast: ${formatMealListDiff([], sub.data.menu.week1.monday.breakfast, true, false)} <br>
                Lunch: ${formatMealListDiff([], sub.data.menu.week1.monday.lunch, true, false)} <br>
                Dinner: ${formatMealListDiff([], sub.data.menu.week1.monday.dinner, true, false)}
              </div>
              <button type="button" class="btn" style="margin-top: 12px;" onclick="openWeeklyMenuForSubmission('${subId}', '${sub.data.name}', ${sub.data.weeklyCycle})">
                View Full Proposed Menu
              </button>
            </div>
          `;
        } else if (sub.type === 'edit') {
          // Render Side-by-Side Diff comparing current details vs proposed details
          const currentPG = pgsList.find(p => p._id === sub.pgId);
          
          let currentPGDetails = '<em>PG deleted</em>';
          let proposedPGDetails = '';
          
          if (currentPG) {
            // Render diff fields
            subContentHtml = `
              <div class="diff-container">
                <!-- Current PG Column -->
                <div class="diff-column current">
                  <div class="diff-column-title">Current PG Menu (Week 1 Monday)</div>
                  <strong>PG Name:</strong> ${currentPG.name} <br>
                  <strong>Schedule:</strong> ${currentPG.weeklyCycle} Week Cycle <br>
                  <div style="margin-top:8px;">
                    Breakfast: ${formatMealListDiff(currentPG.menu.week1.monday.breakfast, sub.data.menu.week1.monday.breakfast, false, true)} <br>
                    Lunch: ${formatMealListDiff(currentPG.menu.week1.monday.lunch, sub.data.menu.week1.monday.lunch, false, true)} <br>
                    Dinner: ${formatMealListDiff(currentPG.menu.week1.monday.dinner, sub.data.menu.week1.monday.dinner, false, true)}
                  </div>
                  <button type="button" class="btn" style="margin-top: 12px; padding: 6px 12px; font-size:12px;" onclick="openWeeklyMenuModal('${sub.pgId}')">
                    View Full Current Menu
                  </button>
                </div>
                <!-- Proposed Edits Column -->
                <div class="diff-column proposed">
                  <div class="diff-column-title">Proposed Edit (Week 1 Monday)</div>
                  <strong>PG Name:</strong> ${sub.data.name} <br>
                  <strong>Schedule:</strong> ${sub.data.weeklyCycle} Week Cycle <br>
                  <div style="margin-top:8px;">
                    Breakfast: ${formatMealListDiff(currentPG.menu.week1.monday.breakfast, sub.data.menu.week1.monday.breakfast, true, true)} <br>
                    Lunch: ${formatMealListDiff(currentPG.menu.week1.monday.lunch, sub.data.menu.week1.monday.lunch, true, true)} <br>
                    Dinner: ${formatMealListDiff(currentPG.menu.week1.monday.dinner, sub.data.menu.week1.monday.dinner, true, true)}
                  </div>
                  <button type="button" class="btn" style="margin-top: 12px; padding: 6px 12px; font-size:12px;" onclick="openWeeklyMenuForSubmission('${subId}', '${sub.data.name}', ${sub.data.weeklyCycle})">
                    View Full Proposed Menu
                  </button>
                </div>
              </div>
            `;
          }
        }
        
        const submissionCard = `
          <div class="submission-item glass-panel">
            <div class="submission-item-header">
              <div>
                <span class="submission-type-badge ${sub.type}">${sub.type === 'new' ? 'New PG Addition' : 'Menu Edit Request'}</span>
                <span style="font-size:16px; font-weight:600; margin-left: 10px;">${sub.data.name}</span>
              </div>
              <div class="submission-meta">
                Submitted by: <strong>${sub.submittedBy}</strong> on ${subDate}
              </div>
            </div>
            
            ${subContentHtml}
            
            <div style="display:flex; justify-content: flex-end; gap:12px; margin-top: 20px; border-top:1px solid var(--glass-border); padding-top:15px;">
              <button class="btn btn-danger" onclick="moderateSubmission('${subId}', 'reject')">Reject</button>
              <button class="btn btn-success" onclick="moderateSubmission('${subId}', 'approve')">Approve & Publish</button>
            </div>
          </div>
        `;
        
        submissionsContainer.innerHTML += submissionCard;
      });
    }

    // Approve/Reject Submission Action
    async function moderateSubmission(subId, action) {
      const endpoint = `/api/submissions/${subId}/${action}`;
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const data = await response.json();
        
        if (response.ok) {
          alert(`Submission ${action}d successfully!`);
          // Re-fetch list
          await fetchPGs();
          await fetchAndRenderSubmissions();
        } else {
          alert('Moderation failed: ' + data.error);
        }
      } catch (err) {
        console.error(`Error during submission ${action}:`, err);
      }
    }

    // Window size monitoring to dynamically adjust views
    window.addEventListener('resize', () => {
      if (window.innerWidth <= 768 && currentView === 'board') {
        setView('grid');
      }
    });

    // Start App
    window.onload = init;
  </script>
</body>
</html>
